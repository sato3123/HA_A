name: Update fuel cost adjustment

# 燃料費調整単価を毎日確かめ、新しく公表されていれば server/tariffs.json に書き足す。
# 家のサーバーは5分おきの自動更新で、新しい単価表を取り込む。
on:
  schedule:
    - cron: "23 1 * * *"   # 毎日 10:23（日本時間）
  workflow_dispatch:
    inputs:
      debug:
        description: "資料の文字の様子も表示する（書きかえない）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pdftotext
        run: sudo apt-get install -y -qq poppler-utils > /dev/null
      - name: Read the published unit prices
        run: python3 tools/update_fuel.py ${{ inputs.debug && '--debug' || '' }}
      - name: Commit if changed
        if: ${{ !inputs.debug }}
        run: |
          if git diff --quiet server/tariffs.json; then echo "変わりありません"; exit 0; fi
          python3 -c "import json;json.load(open('server/tariffs.json'))"
          git config user.name "homepanel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/tariffs.json
          git commit -m "Fuel cost adjustment: new published unit prices"
          git push
