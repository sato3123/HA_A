name: Publish screenshots (rerun)

# 起動テストで撮った画面写真を、あとから確認用のリリース（ui-preview）に載せ直す
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "起動テストの実行ID"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download "${{ inputs.run_id }}" -p 'shots-*' -D shots
          mapfile -t files < <(find shots -name '*.png' | sort)
          [ ${#files[@]} -gt 0 ] || { echo "::error::画面写真がありません"; exit 1; }
          gh release delete ui-preview --yes --cleanup-tag 2>/dev/null || true
          gh release create ui-preview "${files[@]}" --prerelease --title "画面の確認用（自動テスト）" \
            --notes "自動テストで撮った画面写真です。アプリの更新には使われません。（実行 ${{ inputs.run_id }}）"
