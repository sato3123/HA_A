name: Launch test (Android emulator)

# 仮想の Android 端末でアプリを実際に起動して、止まらないことを確かめる
on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/launch-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleDebug --no-daemon -q

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Fire HD 8（第10世代）と同じ Android 9 で試す
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/launch-check.sh

      # 画面写真を確認用のリリース（ui-preview）に載せる（アプリの更新には使われない「プレリリース」）
      - name: Publish screenshots
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls launch-*.png >/dev/null 2>&1 || exit 0
          gh release delete ui-preview --yes --cleanup-tag 2>/dev/null || true
          gh release create ui-preview launch-*.png --prerelease --title "画面の確認用（自動テスト）" \
            --notes "自動テストで撮った画面写真です。アプリの更新には使われません。（${GITHUB_SHA::7}）"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-test-result
          path: |
            launch-*.png
            logcat.txt
