name: Test iPad server setup

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      # サーバーの単体テスト（認証・認可・入力の検証・ECHONET Lite の操作・お湯の予想など。実機には何も送らない）
      - name: Server unit tests
        run: python3 -m unittest discover -s server/tests -v

      # Home Assistant の代わり：受け取ったヘッダーをそのまま返す
      - name: Start fake Home Assistant
        run: |
          cat > fake_ha.py <<'EOF'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  # /api/ はトークンの確認：「good」（管理者）と「user」（一般の人）だけ正しいことにする
                  auth = self.headers.get("Authorization")
                  if self.path == "/api/" and auth not in ("Bearer good", "Bearer user"):
                      self.send_response(401); self.end_headers(); return
                  # /api/error_log は管理者だけ（管理者かどうかの確認に使う）
                  if self.path == "/api/error_log" and auth != "Bearer good":
                      self.send_response(401); self.end_headers(); return
                  body = json.dumps({"path": self.path, "headers": dict(self.headers)}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(body)
              do_POST = do_GET
          HTTPServer(("127.0.0.1", 8123), H).serve_forever()
          EOF
          nohup python3 fake_ha.py > fake_ha.log 2>&1 &
          sleep 1
          curl -fsS http://127.0.0.1:8123/manifest.json

      - name: Run setup.sh
        # リポジトリが非公開なので、Actions のトークンで読む（家のサーバーでは homepanel-github-token で登録したトークン）
        env:
          GH_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 止まったときに記録が残るよう、時間を区切る（ふだんは1〜2分）
        timeout-minutes: 20
        run: sudo HA_IP=127.0.0.1 SELF_IP=127.0.0.1 GITHUB_TOKEN="$GH_READ_TOKEN" bash -x server/setup.sh 2>&1 | sed -e 's/github_pat_[A-Za-z0-9_]*/***/g' -e 's/ghs_[A-Za-z0-9]*/***/g'; test "${PIPESTATUS[0]}" = 0

      - name: Check the server
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }
          echo "::notice::Caddy $(caddy version | head -1)"
          # iPad 版が https で配信されている
          curl -fsSk https://127.0.0.1/homepanel/version.json | tee v.json
          grep -q '"code"' v.json || fail "version.json が配信されていません"
          curl -fsSk https://127.0.0.1/homepanel/ | grep -q "ホームパネル" || fail "index.html が配信されていません"
          # トップは /homepanel/ へ
          curl -sk -o /dev/null -w "%{http_code} %{redirect_url}\n" https://127.0.0.1/ | grep -q "302 https://127.0.0.1/homepanel/" || fail "トップのリダイレクトが違います"
          # Home Assistant への中継（転送元ヘッダーが消えていること）
          curl -fsSk -H "X-Forwarded-For: 1.2.3.4" https://127.0.0.1/api/echo | tee echo.json
          python3 - <<'EOF'
          import json, sys
          j = json.load(open("echo.json"))
          h = {k.lower(): v for k, v in j["headers"].items()}
          assert j["path"] == "/api/echo", j["path"]
          for k in ("x-forwarded-for", "x-forwarded-proto", "x-forwarded-host"):
              if k in h:
                  print(f"::error::{k} が Home Assistant に送られています: {h[k]}")
                  sys.exit(1)
          print("::notice::中継OK（転送元ヘッダーなし）")
          EOF
          # 証明書の配布（http）
          curl -fsS http://127.0.0.1/ca.crt -o ca.crt
          openssl x509 -in ca.crt -noout -subject | tee subj.txt
          grep -qi "Caddy Local Authority" subj.txt || fail "ca.crt が Caddy の証明書ではありません"
          # その証明書で https を検証できる
          curl -fsS --cacert ca.crt https://127.0.0.1/homepanel/version.json > /dev/null || fail "ca.crt で https を検証できません"
          # スクリーンセーバーの写真サービス（Google 以外は断る）
          sleep 1
          curl -fsSk "https://127.0.0.1/photos-api/album?url=https://example.com/" | tee photos.json
          grep -q '"error"' photos.json || fail "写真サービスが動いていません"
          python3 - <<'PYEOF'
          src = open("/usr/local/bin/homepanel-photos").read().split("ThreadingHTTPServer((")[0]
          ns = {}
          exec(src, ns)
          html = 'x ["https://lh3.googleusercontent.com/pw/AP1GczAAAA_bbb-ccc",4032,3024,null] y ["https://lh3.googleusercontent.com/a/ICON",96,96] ["https://lh3.googleusercontent.com/pw/AP1GczAAAA_bbb-ccc",4032,3024]'
          got = ns["extract"](html)
          assert got == ["https://lh3.googleusercontent.com/pw/AP1GczAAAA_bbb-ccc"], got
          print("::notice::写真URLの取り出しOK")
          PYEOF
          # おひさま沸き上げ・カメラの記録のサービス
          for svc in homepanel-solar homepanel-camera; do
            systemctl is-active $svc || { sudo journalctl -u $svc --no-pager | tail -30; fail "$svc が動いていません"; }
          done
          sleep 2
          # トークンが無い・違うときは断る（家の中のほかの機器から勝手に操作されないように）
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/solar-api/status)" = "401" ] || fail "トークンなしで /solar-api に入れてしまいます"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer bad' http://127.0.0.1/camera-api/status)" = "401" ] || fail "違うトークンで /camera-api に入れてしまいます"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{"ha_url":"http://evil"}' http://127.0.0.1/solar-api/config)" = "401" ] || fail "トークンなしで設定を変えられてしまいます"
          curl -fsS -H 'Authorization: Bearer good' http://127.0.0.1/solar-api/climate | grep -q '"enabled"' || fail "/solar-api/climate に届きません"
          curl -fsS -H 'Authorization: Bearer good' http://127.0.0.1/camera-api/status | grep -q '"cameras"' || fail "/camera-api/status に届きません"
          curl -fsS -H 'Authorization: Bearer good' http://127.0.0.1/solar-api/tariffs | grep -q '従量電灯' || fail "電気料金の単価表が読めません"
          curl -fsS -H 'Authorization: Bearer good' -X POST -H 'Content-Type: application/json' -d '{"tariff_plan":"tepco_smartlife_s","tariff_contract":60}' http://127.0.0.1/solar-api/config > /dev/null
          curl -fsS -H 'Authorization: Bearer good' http://127.0.0.1/solar-api/tariffs | grep -q 'basic_yen' || fail "プランを選べません"
          curl -fsS -H "Authorization: Bearer good" "http://127.0.0.1/solar-api/energy5?date=2026-01-01" | grep -q '"slots"' || fail "/solar-api/energy5 に届きません"
          curl -fsS -H 'Authorization: Bearer good' http://127.0.0.1/solar-api/timers | grep -q '"timers"' || fail "/solar-api/timers に届きません"
          curl -fsS -H 'Authorization: Bearer good' http://127.0.0.1/solar-api/live | grep -q '"away_until"' || fail "/solar-api/live に届きません"
          curl -fsS -H 'Authorization: Bearer good' -X POST http://127.0.0.1/solar-api/aiseg-probe | grep -q '"patterns"' || fail "/solar-api/aiseg-probe が動きません"
          curl -fsS -H 'Authorization: Bearer good' -X POST -H 'Content-Type: application/json' -d '{"hot_auto":true,"hot_extra":[{"date":"2099-01-01","liters":100,"part":"evening","note":"t"}]}' http://127.0.0.1/solar-api/config | grep -q '"hot_plan"' || fail "お湯の量の自動の設定ができません"
          curl -fsS -H 'Authorization: Bearer good' http://127.0.0.1/solar-api/demand | grep -q '"slots"' || fail "/solar-api/demand に届きません"
          curl -fsS -H 'Authorization: Bearer good' -X POST -H 'Content-Type: application/json' -d '{"groups":[{"name":"t","entities":["light.a"],"action":"off"}]}' http://127.0.0.1/solar-api/config | grep -q '"light.a"' || fail "まとめて操作のボタンを保存できません"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer good' -X POST -H 'Content-Type: application/json' -d '{"groups":[{"name":"t","entities":["shell_command.x"]}]}' http://127.0.0.1/solar-api/config)" = "400" ] || fail "まとめて操作に危ない機器を入れられてしまいます"
          curl -fsS -H 'Authorization: Bearer good' -X POST -H 'Content-Type: application/json' -d '{"el_devices":[{"id":"climate.el_192_168_1_50_013001","name":"エアコン","room":"寝室"}]}' http://127.0.0.1/solar-api/config | grep -q 'el_192_168_1_50_013001' || fail "ECHONET Lite の機器の一覧を保存できません"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer good' -X POST -H 'Content-Type: application/json' -d '{"el_devices":[{"id":"climate.el_8_8_8_8_013001"}]}' http://127.0.0.1/solar-api/config)" = "400" ] || fail "家の外の ECHONET Lite の機器を登録できてしまいます"
          # ---- 認証・認可（修正依頼書 P0） ----
          # Caddy を通さず直接・転送のヘッダーなしでも、トークンが無ければ断る
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8098/status)" = "401" ] || fail "直接つなぐとトークンなしで入れてしまいます"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8097/status)" = "401" ] || fail "カメラに直接つなぐとトークンなしで入れてしまいます"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-For: 127.0.0.1' http://127.0.0.1:8098/status)" = "401" ] || fail "転送のヘッダーを付けるとトークンなしで入れてしまいます"
          # URL のクエリのトークンは受け付けない
          [ "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1/solar-api/status?token=good')" = "401" ] || fail "URL のトークンで入れてしまいます"
          [ "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1/camera-api/status?token=good')" = "401" ] || fail "カメラに URL のトークンで入れてしまいます"
          # このサーバーの中からは、ローカルのトークン（homepanel-api）で使える
          sudo /usr/local/bin/homepanel-api solar GET /status | grep -q '"night_pending"' || fail "homepanel-api で使えません"
          sudo /usr/local/bin/homepanel-api camera GET /status | grep -q '"cameras"' || fail "homepanel-api でカメラを使えません"
          # 一般の人：読む・ふだんの設定はできるが、接続先・パスワード・調べ物は管理者だけ
          curl -fsS -H 'Authorization: Bearer user' http://127.0.0.1/solar-api/status | grep -q '"night_pending"' || fail "一般の人が状態を読めません"
          curl -fsS -H 'Authorization: Bearer user' -X POST -H 'Content-Type: application/json' -d '{"hot_margin_l":60}' http://127.0.0.1/solar-api/config | grep -q '"hot_margin_l": 60' || fail "一般の人がふだんの設定を変えられません"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer user' -X POST -d '{"aiseg_password":"x"}' http://127.0.0.1/solar-api/config)" = "403" ] || fail "一般の人が AiSEG2 のパスワードを変えられてしまいます"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer user' -X POST -d '{"eco_ip":"192.168.1.99"}' http://127.0.0.1/solar-api/config)" = "403" ] || fail "一般の人が機器のアドレスを変えられてしまいます"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer user' -X POST http://127.0.0.1/solar-api/aiseg-raw -d '{"path":"/page/x"}')" = "403" ] || fail "一般の人が AiSEG2 を調べられてしまいます"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer user' -X POST -d '{"cameras":[]}' http://127.0.0.1/camera-api/config)" = "403" ] || fail "一般の人がカメラの設定を変えられてしまいます"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer good' -X POST -d '{"eco_ip":""}' http://127.0.0.1/solar-api/config)" = "200" ] || fail "管理者が設定を変えられません"
          # 入力の検証：大きすぎる・形が違う
          head -c 300000 /dev/zero | tr '\0' 'a' > big.txt
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer good' -X POST --data-binary @big.txt http://127.0.0.1/solar-api/config)" = "413" ] || fail "大きすぎるデータを受け付けてしまいます"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer good' -X POST -d '[1,2]' http://127.0.0.1/solar-api/config)" = "400" ] || fail "JSON のオブジェクト以外を受け付けてしまいます"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer good' 'http://127.0.0.1/camera-api/frame?cam=../../etc&t=1')" = "404" ] || fail "登録していないカメラの画像を探してしまいます"
          # iPad 版の画面の安全のための設定（CSP など）
          curl -sk -D - -o /dev/null https://127.0.0.1/homepanel/ | grep -qi "content-security-policy: default-src 'self'" || fail "CSP がありません"
          curl -fsSk https://127.0.0.1/homepanel/boot.js | grep -q 'version.json' || fail "boot.js が配信されていません"
          # Android 版の配布（Home Assistant のトークンが無いと取れない）
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/android/latest.json)" = "401" ] || fail "トークンなしで Android 版を取れてしまいます"
          # TimeTree の予定の公開（.ics だけ・家の中だけ）
          systemctl is-active homepanel-calendar.timer || fail "TimeTree の取り込みのタイマーが動いていません"
          test -x /opt/timetree/bin/timetree-exporter || fail "timetree-exporter が入っていません"
          printf 'BEGIN:VCALENDAR\r\nEND:VCALENDAR\r\n' | sudo tee /var/lib/homepanel-calendar/test.ics > /dev/null
          echo secret | sudo tee /var/lib/homepanel-calendar/secret.txt > /dev/null
          curl -fsS http://127.0.0.1/calendar/test.ics | grep -q VCALENDAR || fail "/calendar/test.ics が配信されていません"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/calendar/secret.txt)" = "404" ] || fail ".ics 以外が見えてしまいます"
          sudo /usr/local/bin/homepanel-calendar status
          # 自動更新タイマー
          systemctl is-active homepanel-update.timer || fail "更新タイマーが動いていません"
          sudo /usr/local/bin/homepanel-update
          # セットアップの新しい版を見つけたら、コマンドを入れなくても自分で実行し直す
          [ "$(cat /etc/homepanel/setup_version)" -ge 2 ] || fail "セットアップの版が記録されていません"
          grep -q '^HA_IP=127.0.0.1$' /etc/homepanel/setup.env || fail "セットアップで使った値が残っていません"
          # 5分おきの更新（タイマー）と重ならないように、いったん止める（自動のセットアップがまた動かす）
          sudo systemctl stop homepanel-update.timer homepanel-update.service
          echo 1 | sudo tee /etc/homepanel/setup_version > /dev/null
          sudo bash -x /usr/local/bin/homepanel-update 2>&1 | sed -e 's/github_pat_[A-Za-z0-9_]*/***/g' -e 's/ghs_[A-Za-z0-9]*/***/g' > upd.log || true
          grep -q "セットアップの新しい版" upd.log || { grep -v "^+* *curl\|Authorization" upd.log | tail -40; fail "セットアップの新しい版を見つけていません"; }
          for i in $(seq 1 90); do [ "$(cat /etc/homepanel/setup_version)" != 1 ] && break; sleep 5; done
          sudo tail -20 /var/lib/homepanel-setup/last.log
          [ "$(cat /etc/homepanel/setup_version)" -ge 2 ] || fail "セットアップを自分で実行し直せませんでした"
          sudo tail -1 /var/lib/homepanel-setup/last.log | grep -q "終了コード 0" || fail "自動のセットアップが失敗しました"
          curl -fsS -H 'Authorization: Bearer good' http://127.0.0.1/solar-api/status | grep -q '"server_setup"' || fail "セットアップの様子を返していません"
          systemctl is-active homepanel-solar homepanel-camera caddy || fail "自動のセットアップのあと、サービスが止まっています"
          echo "::notice::サーバーのセットアップは正常です"
          # テストが終わったら、入れたサービスとタイマーを止める（ランナーの後片付けとぶつからないように）
          sudo systemctl disable --now homepanel-update.timer > /dev/null 2>&1 || true
          sudo systemctl stop homepanel-update.service homepanel-selfsetup.service homepanel-solar homepanel-camera homepanel-photos caddy 2>/dev/null || true
