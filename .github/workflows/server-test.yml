name: Test iPad server setup

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Home Assistant の代わり：受け取ったヘッダーをそのまま返す
      - name: Start fake Home Assistant
        run: |
          cat > fake_ha.py <<'EOF'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  # /api/ はトークンの確認：「good」だけ正しいことにする
                  if self.path == "/api/" and self.headers.get("Authorization") != "Bearer good":
                      self.send_response(401); self.end_headers(); return
                  body = json.dumps({"path": self.path, "headers": dict(self.headers)}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(body)
              do_POST = do_GET
          HTTPServer(("127.0.0.1", 8123), H).serve_forever()
          EOF
          nohup python3 fake_ha.py > fake_ha.log 2>&1 &
          sleep 1
          curl -fsS http://127.0.0.1:8123/manifest.json

      - name: Run setup.sh
        run: sudo HA_IP=127.0.0.1 SELF_IP=127.0.0.1 bash server/setup.sh

      - name: Check the server
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }
          echo "::notice::Caddy $(caddy version | head -1)"
          # iPad 版が https で配信されている
          curl -fsSk https://127.0.0.1/homepanel/version.json | tee v.json
          grep -q '"code"' v.json || fail "version.json が配信されていません"
          curl -fsSk https://127.0.0.1/homepanel/ | grep -q "ホームパネル" || fail "index.html が配信されていません"
          # トップは /homepanel/ へ
          curl -sk -o /dev/null -w "%{http_code} %{redirect_url}\n" https://127.0.0.1/ | grep -q "302 https://127.0.0.1/homepanel/" || fail "トップのリダイレクトが違います"
          # Home Assistant への中継（転送元ヘッダーが消えていること）
          curl -fsSk -H "X-Forwarded-For: 1.2.3.4" https://127.0.0.1/api/echo | tee echo.json
          python3 - <<'EOF'
          import json, sys
          j = json.load(open("echo.json"))
          h = {k.lower(): v for k, v in j["headers"].items()}
          assert j["path"] == "/api/echo", j["path"]
          for k in ("x-forwarded-for", "x-forwarded-proto", "x-forwarded-host"):
              if k in h:
                  print(f"::error::{k} が Home Assistant に送られています: {h[k]}")
                  sys.exit(1)
          print("::notice::中継OK（転送元ヘッダーなし）")
          EOF
          # 証明書の配布（http）
          curl -fsS http://127.0.0.1/ca.crt -o ca.crt
          openssl x509 -in ca.crt -noout -subject | tee subj.txt
          grep -qi "Caddy Local Authority" subj.txt || fail "ca.crt が Caddy の証明書ではありません"
          # その証明書で https を検証できる
          curl -fsS --cacert ca.crt https://127.0.0.1/homepanel/version.json > /dev/null || fail "ca.crt で https を検証できません"
          # スクリーンセーバーの写真サービス（Google 以外は断る）
          sleep 1
          curl -fsSk "https://127.0.0.1/photos-api/album?url=https://example.com/" | tee photos.json
          grep -q '"error"' photos.json || fail "写真サービスが動いていません"
          python3 - <<'PYEOF'
          src = open("/usr/local/bin/homepanel-photos").read().split("ThreadingHTTPServer((")[0]
          ns = {}
          exec(src, ns)
          html = 'x ["https://lh3.googleusercontent.com/pw/AP1GczAAAA_bbb-ccc",4032,3024,null] y ["https://lh3.googleusercontent.com/a/ICON",96,96] ["https://lh3.googleusercontent.com/pw/AP1GczAAAA_bbb-ccc",4032,3024]'
          got = ns["extract"](html)
          assert got == ["https://lh3.googleusercontent.com/pw/AP1GczAAAA_bbb-ccc"], got
          print("::notice::写真URLの取り出しOK")
          PYEOF
          # おひさま沸き上げ・カメラの記録のサービス
          for svc in homepanel-solar homepanel-camera; do
            systemctl is-active $svc || { sudo journalctl -u $svc --no-pager | tail -30; fail "$svc が動いていません"; }
          done
          sleep 2
          # トークンが無い・違うときは断る（家の中のほかの機器から勝手に操作されないように）
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/solar-api/status)" = "401" ] || fail "トークンなしで /solar-api に入れてしまいます"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer bad' http://127.0.0.1/camera-api/status)" = "401" ] || fail "違うトークンで /camera-api に入れてしまいます"
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{"ha_url":"http://evil"}' http://127.0.0.1/solar-api/config)" = "401" ] || fail "トークンなしで設定を変えられてしまいます"
          curl -fsS -H 'Authorization: Bearer good' http://127.0.0.1/solar-api/climate | grep -q '"enabled"' || fail "/solar-api/climate に届きません"
          curl -fsS -H 'Authorization: Bearer good' http://127.0.0.1/camera-api/status | grep -q '"cameras"' || fail "/camera-api/status に届きません"
          curl -fsS -H 'Authorization: Bearer good' http://127.0.0.1/solar-api/tariffs | grep -q '従量電灯' || fail "電気料金の単価表が読めません"
          curl -fsS -H 'Authorization: Bearer good' -X POST -H 'Content-Type: application/json' -d '{"tariff_plan":"tepco_smartlife_s","tariff_contract":60}' http://127.0.0.1/solar-api/config > /dev/null
          curl -fsS -H 'Authorization: Bearer good' http://127.0.0.1/solar-api/tariffs | grep -q 'basic_yen' || fail "プランを選べません"
          curl -fsS -H "Authorization: Bearer good" "http://127.0.0.1/solar-api/energy5?date=2026-01-01" | grep -q '"slots"' || fail "/solar-api/energy5 に届きません"
          curl -fsS -H 'Authorization: Bearer good' http://127.0.0.1/solar-api/timers | grep -q '"timers"' || fail "/solar-api/timers に届きません"
          # TimeTree の予定の公開（.ics だけ・家の中だけ）
          systemctl is-active homepanel-calendar.timer || fail "TimeTree の取り込みのタイマーが動いていません"
          test -x /opt/timetree/bin/timetree-exporter || fail "timetree-exporter が入っていません"
          printf 'BEGIN:VCALENDAR\r\nEND:VCALENDAR\r\n' | sudo tee /var/lib/homepanel-calendar/test.ics > /dev/null
          echo secret | sudo tee /var/lib/homepanel-calendar/secret.txt > /dev/null
          curl -fsS http://127.0.0.1/calendar/test.ics | grep -q VCALENDAR || fail "/calendar/test.ics が配信されていません"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/calendar/secret.txt)" = "404" ] || fail ".ics 以外が見えてしまいます"
          sudo /usr/local/bin/homepanel-calendar status
          # 自動更新タイマー
          systemctl is-active homepanel-update.timer || fail "更新タイマーが動いていません"
          sudo /usr/local/bin/homepanel-update
          echo "::notice::サーバーのセットアップは正常です"
