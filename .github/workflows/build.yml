name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Android SDK が入っている環境に固定
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check web app syntax
        run: |
          node --check web/app.js
          node --check web/capture-worklet.js

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::署名鍵（KEYSTORE_BASE64）が未登録のため、デバッグ署名でビルドします。リリースには Android 版を含めません。"
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log || {
            # コンパイルエラーを注釈として出す（ログを開かなくても確認できるように）
            grep -E "^e: |What went wrong|^> " build.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/HomePanel-1.0.${GITHUB_RUN_NUMBER}.apk"

      - name: Package web app (iPad)
        run: |
          echo "{ \"version\": \"1.0.${GITHUB_RUN_NUMBER}\", \"code\": ${GITHUB_RUN_NUMBER} }" > web/version.json
          (cd web && zip -qr ../out/homepanel-web.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: HomePanel-apk
          path: out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HomePanel-web
          path: out/homepanel-web.zip

      # main ブランチでは「リリース」を作る。
      # Android 版・iPad 版ともに、この最新リリースを見て自分で更新する。
      # Android 版は毎回同じ鍵で署名したものだけを載せる（鍵が違うと上書きインストールできないため）。
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B > notes.txt
          files="out/homepanel-web.zip"
          if [ "$SIGNED" = "true" ]; then files="$files out/HomePanel-1.0.${GITHUB_RUN_NUMBER}.apk"; fi
          gh release create "v1.0.${GITHUB_RUN_NUMBER}" $files \
            --title "ホームパネル 1.0.${GITHUB_RUN_NUMBER}" \
            --notes-file notes.txt
