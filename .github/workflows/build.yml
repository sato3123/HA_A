name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Android SDK が入っている環境に固定
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check web app syntax
        run: |
          node --check web/app.js
          node --check web/capture-worklet.js

      - name: Prepare signing key
        env:
          SECRET_KS: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          VAR_KS: ${{ vars.KEYSTORE_BASE64 }}
          VAR_PW: ${{ vars.KEYSTORE_PASSWORD }}
        run: |
          # 登録状況の確認（中身は表示せず、有無と長さだけ）
          echo "::notice::署名鍵の登録状況 Secrets: KEYSTORE_BASE64=${#SECRET_KS}文字 KEYSTORE_PASSWORD=${#SECRET_PW}文字 / Variables: KEYSTORE_BASE64=${#VAR_KS}文字 KEYSTORE_PASSWORD=${#VAR_PW}文字"
          KS="${SECRET_KS:-$VAR_KS}"
          PW="${SECRET_PW:-$VAR_PW}"
          if [ -n "$VAR_KS$VAR_PW" ]; then
            echo "::warning::署名鍵が Variables（変数）に登録されています。Secrets（秘密）に登録し直し、Variables からは削除してください。"
          fi
          if [ -n "$KS" ] && [ -n "$PW" ]; then
            echo "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks" || { echo "::error::KEYSTORE_BASE64 の値が正しくありません（途中で切れているか、余分な文字が入っています）"; exit 1; }
            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$PW" -alias homepanel >/dev/null 2>&1; then
              echo "::error::署名鍵を開けませんでした。KEYSTORE_PASSWORD が違うか、KEYSTORE_BASE64 が壊れています"
              exit 1
            fi
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "::add-mask::$PW"
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "::notice::署名鍵を確認できました。Android 版をリリースに含めます。"
          else
            echo "::warning::署名鍵（KEYSTORE_BASE64 / KEYSTORE_PASSWORD）が見つからないため、デバッグ署名でビルドします。リリースには Android 版を含めません。"
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log || {
            # コンパイルエラーを注釈として出す（ログを開かなくても確認できるように）
            { grep -E "^e: " build.log; grep -A6 "What went wrong" build.log; } | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/HomePanel-1.0.${GITHUB_RUN_NUMBER}.apk"

      - name: Package web app (iPad)
        run: |
          echo "{ \"version\": \"1.0.${GITHUB_RUN_NUMBER}\", \"code\": ${GITHUB_RUN_NUMBER} }" > web/version.json
          (cd web && zip -qr ../out/homepanel-web.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: HomePanel-apk
          path: out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HomePanel-web
          path: out/homepanel-web.zip

      # main ブランチでは「リリース」を作る。
      # Android 版・iPad 版ともに、この最新リリースを見て自分で更新する。
      # Android 版は毎回同じ鍵で署名したものだけを載せる（鍵が違うと上書きインストールできないため）。
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git log -1 --pretty=%B > notes.txt
          files="out/homepanel-web.zip"
          if [ "$SIGNED" = "true" ]; then files="$files out/HomePanel-1.0.${GITHUB_RUN_NUMBER}.apk"; fi
          gh release create "v1.0.${GITHUB_RUN_NUMBER}" $files \
            --title "ホームパネル 1.0.${GITHUB_RUN_NUMBER}" \
            --notes-file notes.txt
